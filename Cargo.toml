[package]
name = "sensor"
version = "0.1.0"
edition = "2024"
default-run = "sensor"

[features]
default = ["mmap", "rayon"]
#default = ["mmap"]
#default = ["rayon"]
#default = []

humidity = []
mmap = ["dep:memmap2"]
rayon = ["dep:rayon"]  # Parallel iterators

[profile.release]
debug = true
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# chrono = "0.4.41"
# chrono-tz = "0.10.3"
jiff = { version = "0.2.21", features = ["static"] }
clap = { version = "4.5.56", features = ["derive"] }
clap_complete = "4.5.65"
iana-time-zone = "0.1.65"
#egui = "0.24.1"
#egui_tiles = "0.4.0"
memmap2 = { version = "0.9.9", optional = true }
rayon = { version = "1.11.0", optional = true }
winnow = "0.7.14"
zip = "7.2.0"

[profile.release-with-debug]
inherits = "release"
debug = true
